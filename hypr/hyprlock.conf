# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock-2.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0,1
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL

shape {
    monitor =
    size = 600, 700
    color = rgba(69, 64, 61, 0.33)
    rounding = 50 
    border_size = 4
    border_color = rgba(0, 0, 0, 0)
    position = 0,-150
    halign = center
    valign = center
}


