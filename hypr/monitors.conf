# Default monitor configuration template
# Copy this file to $(hostname).conf and customize for your machine

# Internal display configuration
# Get your monitor name from: hyprctl monitors
INTERNAL_MONITOR="eDP-1"
INTERNAL_CONFIG="1920x1080@60,0x0,1.5"

# Lid state file path
# Check available paths: ls /proc/acpi/button/lid/*/state
LID_STATE_FILE="/proc/acpi/button/lid/LID/state"

# External monitor configurations
# Get monitor descriptions from: hyprctl monitors
# Format: MONITOR_CONFIGS["Monitor description keyword"]="location,resolution,position,scale"
# Example:
# MONITOR_CONFIGS["Dell U2720Q"]="work,3840x2160@60,0x-1080,2"
# MONITOR_CONFIGS["LG 27UK850"]="home,3840x2160@60,0x-1080,2"
